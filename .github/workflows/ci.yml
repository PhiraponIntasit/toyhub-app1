name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toyhub

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: toyhub
          POSTGRES_PASSWORD: toyhub
          POSTGRES_DB: toyhub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: toyhub/package-lock.json

      - run: npm ci

      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://toyhub:toyhub@localhost:5432/toyhub_test
          DATABASE_SSL: 'off'
